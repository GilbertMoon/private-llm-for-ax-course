name: Course CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall chapter03 chapter04 chapter05 scripts tests

      - name: Run offline tests
        run: |
          pytest -q

      - name: Verify required course files
        shell: bash
        run: |
          test -f README.md
          test -f overview.md
          test -f data/sample/company_policy.txt
          test -f chapter01/README.md
          test -f chapter02/README.md
          test -f chapter03/README.md
          test -f chapter04/README.md
          test -f chapter05/README.md
          test -f chapter06/README.md
          test -f scripts/runtime_preflight.py
          test -f scripts/runtime_validate.py
          test -f tests/mock_openai_server.py

      - name: Start mock OpenAI-compatible server
        run: |
          python tests/mock_openai_server.py > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          sleep 2

      - name: Validate OpenAI-compatible runtime path
        env:
          CHAT_MODEL_ID: mock-chat-model
          EMBEDDING_MODEL_ID: mock-embedding-model
          LM_STUDIO_BASE_URL: http://127.0.0.1:1234/v1
        run: |
          python scripts/runtime_validate.py

      - name: Validate Chapter 03 starter against mock server
        env:
          CHAT_MODEL_ID: mock-chat-model
          LM_STUDIO_BASE_URL: http://127.0.0.1:1234/v1
        run: |
          python chapter03/starter/app.py

      - name: Validate Chapter 04 starter against mock server
        env:
          CHAT_MODEL_ID: mock-chat-model
          EMBEDDING_MODEL_ID: mock-embedding-model
          LM_STUDIO_BASE_URL: http://127.0.0.1:1234/v1
        run: |
          printf '부산 출장 숙박비 한도는 얼마인가요?\n' | python chapter04/starter/rag.py

      - name: Show mock server log on failure
        if: failure()
        run: cat mock-server.log
