name: Course CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall chapter03 chapter04 chapter05 scripts tests

      - name: Run offline tests
        run: |
          pytest -q

      - name: Verify required course files
        shell: bash
        run: |
          test -f README.md
          test -f overview.md
          test -f data/sample/company_policy.txt
          test -f chapter01/README.md
          test -f chapter02/README.md
          test -f chapter03/README.md
          test -f chapter04/README.md
          test -f chapter05/README.md
          test -f chapter06/README.md
          test -f scripts/runtime_preflight.py
          test -f scripts/runtime_validate.py
